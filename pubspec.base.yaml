      url: https://github.com/BenPoell/FlutterBoardView.git
  pointer_interceptor: ^0.10.1+2
  diacritic: ^0.1.3
  states_rebuilder: ^6.3.0
  html2md: ^1.2.6
  printing: ^5.11.0
  image_cropper: ^9.0.0
  msal_js: ^2.14.0
  sign_in_with_apple: ^6.1.3
  window_manager: ^0.4.3
  intl_phone_field: ^3.1.0
  flutter_staggered_grid_view: ^0.7.0
  desktop_drop: ^0.5.0
  widget_kit_plugin: ^0.1.1
  pinch_zoom: ^2.0.0
  collection: ^1.15.0-nullsafety.4
  filesystem_picker: ^4.0.0
  device_info_plus: ^11.1.0
  ios_open_subscriptions_settings: ^0.0.4
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.2
  cloud_firestore: ^5.5.1
  device_preview: ^1.0.0
  firebase_storage: ^12.3.7  
  cached_network_image: ^3.3.0
  cupertino_icons: ^1.0.8
  flutter_html: ^3.0.0-beta.2
  image: ^4.0.17
  cloud_functions: ^5.3.3
  carousel_slider: ^5.0.0
  firebase_messaging: ^15.2.5
  googleapis_auth: ^2.0.0
  dotted_border: ^2.0.0
  flutter_local_notifications: ^19.2.0
  hugeicons: ^0.0.11
  # OVERRIDE_DEPENDENCIES_START
  # OVERRIDE_DEPENDENCIES_END

dependency_overrides:
  intl: any
  navigation_builder: ^0.0.3
  states_rebuilder: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0
  build_runner: ^2.1.0
  what3words: ^3.1.0
  built_value_generator: ^8.1.1
  faker: ^2.0.0
  msix: ^3.5.1
  import_sorter: ^4.6.0
  js: ^0.6.7
  google_maps: ^8.1.1
  google_maps_flutter: ^2.2.0
  firebase_analytics: ^11.3.5

flutter_icons:
    android: true
    ios: true
    image_path: "assets/mis/images/icon.png"
    remove_alpha_ios: true


flutter:
  uses-material-design: true
  # Enable generation of localized Strings from arb files.
  generate: true

  assets:
    - assets/opw/images/defaultUserThumbnail.jpg
    - assets/images/google_logo.png
    - assets/boilerplate/images/icon.png
    - assets/boilerplate/images/defaultEventPhoto.webp
    - assets/boilerplate/images/defaultEventPhoto.png
    - assets/mis/logo.webp
    - assets/datingdemozawaj/images/logo.png
    - assets/datingdemozawaj/images/favicon.webp
    # OVERRIDE_ASSETS_START
    # OVERRIDE_ASSETS_END

  
  fonts:
  - family: Montserrat
    fonts:
      - asset: assets/google_fonts/Montserrat-Regular.ttf
      - asset: assets/google_fonts/Montserrat-Medium.ttf
        weight: 500
      - asset: assets/google_fonts/Montserrat-Bold.ttf
        weight: 700
  - family: Roboto
    fonts:
      - asset: assets/google_fonts/Roboto-Regular.ttf
  # OVERRIDE_FONTS_START
  # OVERRIDE_FONTS_END
