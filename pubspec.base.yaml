name: flutter_boilerplate
description: "Application name"

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.2+12

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^6.2.1 
  in_app_review: ^2.0.4
  in_app_purchase: ^3.1.1
  pinput: ^5.0.0
  flutter_redux: ^0.10.0
  redux_logging: ^0.5.0
  http: ^1.2.2
  path_provider: ^2.0.2
  shared_preferences: ^2.0.6
  material_design_icons_flutter: ^7.0.7296
  built_value: ^8.1.2
  built_collection: ^5.1.0
  memoize: ^3.0.0
  url_launcher: ^6.0.20
  google_fonts: ^6.1.0
  share_plus: ^10.1.1
  intl: ^0.19.0
  flutter_slidable: ^3.0.0
  charts_flutter: ^0.12.0
  package_info_plus: ^8.3.1
  qr_flutter:
    git:
      url: https://github.com/theyakka/qr.flutter.git
  local_auth: ^2.1.5
  image_picker: ^1.0.4
  flutter_colorpicker: ^1.0.3
  flutter_json_viewer: ^1.0.1
  webview_flutter: ^4.4.1
  timeago: ^3.1.0
  # Stripe
  flutter_stripe: ^11.1.0
  stripe_platform_interface: ^11.1.0
  rounded_loading_button:
    git:
      url: https://github.com/scopendo/flutter_rounded_loading_button.git
      ref: master      
  version: ^3.0.2
  overflow_view: ^0.4.0
  flutter_styled_toast: ^2.0.0
  permission_handler: ^11.0.1
  file_picker: ^8.1.3
  boardview:
